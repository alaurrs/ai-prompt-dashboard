<!-- features/chat/empty-state/chat-empty-state.component.html -->
<section class="h-full grid place-items-center p-6">
  <div class="max-w-3xl w-full text-center space-y-8">
    <h1 class="text-3xl md:text-4xl font-semibold">Qu’est-ce qui vous intéresse aujourd’hui ?</h1>

    <div class="rounded-2xl shadow-md border p-2 flex items-center gap-2">
      <i class="pi pi-plus text-lg opacity-60"></i>
      <input pInputText class="flex-1 border-0 outline-none bg-transparent"
             placeholder="Poser une question" [(ngModel)]="draft"
             (keydown.enter)="startNewChat()" />
      <button pButton icon="pi pi-microphone" class="p-button-text"></button>
      <button pButton icon="pi pi-wave-pulse" class="p-button-text"></button>
    </div>

    <div class="flex justify-center gap-3">
      <button pButton label="Nouveau chat" icon="pi pi-send" (click)="startNewChat()"></button>
    </div>
  </div>
</section>
